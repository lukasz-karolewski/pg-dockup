name: test

on:
  push:
  pull_request:

jobs:
  backup-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check shell syntax
        run: |
          for script in backup-create.sh backup-download-last.sh run.sh; do
            bash -n "$script"
          done
      - name: Test downloads with the AWS CLI
        run: |
          aws --version
          python3 -m unittest discover -s tests -v
